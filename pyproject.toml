[project]
name = "feature-tracker"
version = "0.1.0"
description = "Desktop tool for tracking image features through a frame sequence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "opencv-python>=4.5,<5",
    "numpy>=1.21,<2",
    "scipy>=1.10,<2",  # used by bundled plugins (Delaunay triangulation, savemat)
    "matplotlib>=3.7,<4",  # used by bundled analysis plugins for embedded plots
]

[project.scripts]
tracker = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
"app.gui" = ["icons/*.svg", "help.html"]

[tool.uv]
python-preference = "only-managed"  # always use uv's own CPython, never system

[dependency-groups]
dev = [
    "nuitka>=4.1.2",
]
