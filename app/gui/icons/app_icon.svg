<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>

  <!-- motion trail: fading dots curving up toward the locked point -->
  <g fill="#ffffff">
    <circle cx="70"  cy="184" r="6" opacity="0.28"/>
    <circle cx="100" cy="162" r="7" opacity="0.45"/>
    <circle cx="130" cy="140" r="8" opacity="0.64"/>
    <circle cx="160" cy="118" r="9" opacity="0.82"/>
  </g>

  <!-- locked feature point: halo + cyan ring + white core -->
  <circle cx="190" cy="96" r="34" fill="url(#glow)"/>
  <circle cx="190" cy="96" r="22" fill="none" stroke="#67e8f9" stroke-width="6"/>
  <circle cx="190" cy="96" r="9"  fill="#ffffff"/>
</svg>
