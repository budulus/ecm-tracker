[package]
name = "ecm-pyhost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Embedded CPython + the PluginContext bridge (ports app/plugins/ SDK).
# pyo3 + the numpy interop crate land here once the bundled interpreter spike
# (Task 3) is wired up.
[dependencies]
pyo3 = { version = "0.27.2", features = ["auto-initialize"] }
numpy = "0.27"        # zero-copy NumPy interop (rust-numpy); 0.27 pairs with pyo3 0.27
ndarray = "0.16"      # matches core's pin and numpy 0.27's accepted range so ArrayBase types unify
