[workspace]
resolver = "2"
members = ["crates/core", "crates/gui", "crates/pyhost"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# Shared dependency versions are pinned here once the Phase 0 spikes settle.
# (eframe/egui, pyo3, ndarray, serde land in crate manifests via `cargo add`.)
[workspace.dependencies]
ecm-core = { path = "crates/core" }
